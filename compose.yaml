name: life-simulator
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        HOST_UID: "${HOST_UID:-1000}"
        HOST_GID: "${HOST_GID:-1000}"
    image: life-simulator-dev
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    networks:
      default:
        aliases: [vite]
    environment:
      CHOKIDAR_USEPOLLING: "${CHOKIDAR_USEPOLLING:-false}"
    command: npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      retries: 20
  wasm:
    profiles: [wasm]
    build:
      context: .
      dockerfile: docker/Dockerfile.wasm
      args:
        HOST_UID: "${HOST_UID:-1000}"
        HOST_GID: "${HOST_GID:-1000}"
    image: life-simulator-wasm
    volumes:
      - .:/work
      - cargo_cache:/home/dev/.cargo
  e2e:
    profiles: [e2e]
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /app
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ipc: host
    environment:
      HOME: /tmp
      CI: "1"
      BASE_URL: "http://vite:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      app:
        condition: service_healthy
    command: npx playwright test
  web:
    profiles: [prod]
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    image: life-simulator-prod
    ports:
      - "8080:80"
    networks:
      default:
        aliases: [web]
volumes:
  node_modules:
  cargo_cache:
