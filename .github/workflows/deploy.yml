# Publishes the simulator to GitHub Pages on every push to the main branch (or on demand).
# One-time setting on the GitHub side: Settings → Pages → Build and deployment → Source = "GitHub Actions".
# The site is 100 % static (no API): everything is saved in the visitors' browser.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one publication at a time; a newer one replaces the one in progress
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Simulation engine: Rust -> WebAssembly (the .wasm is not in the repository)
      - name: Test and build the Rust engine
        run: |
          rustup target add wasm32-unknown-unknown
          cd wasm
          cargo test
          cargo build --release --target wasm32-unknown-unknown
          mkdir -p ../src/sim/wasm
          cp target/wasm32-unknown-unknown/release/life_sim.wasm ../src/sim/wasm/life.wasm

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Site address: https://<account>.github.io/<repo>/ (or the root for <account>.github.io / a custom domain)
      - name: Compute the publication address
        id: site
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          if [ -n "$CUSTOM_DOMAIN" ]; then
            BASE="/"; URL="https://${CUSTOM_DOMAIN}"
          elif [ "$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" = "${OWNER}.github.io" ]; then
            BASE="/"; URL="https://${OWNER}.github.io"
          else
            BASE="/${REPO}/"; URL="https://${OWNER}.github.io/${REPO}"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Publishing to $URL (base $BASE)"

      - name: Build the site
        env:
          BASE_PATH: ${{ steps.site.outputs.base }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
